# .cfdb/indexes.toml — persistent inverted indexes on `:Item` props + computed keys.
#
# Consumed by `cfdb_petgraph::index::spec::IndexSpec::from_path` at
# composition-root wiring (slice 7 / #186); the build pass (slice 2 / #181)
# populates `KeyspaceState::by_prop` from the entries below at
# `ingest_nodes` time. See docs/RFC-035-persistent-inverted-indexes.md §3.2.
#
# Each `[[index]]` entry carries a REQUIRED `notes` string documenting who
# consumes the index and why (R1 R2 resolution — DDD lens).
#
# Slice 1 (#180) only loads this file; entries have no effect on evaluation
# until slice 5 (#184) and slice 6 (#185) wire the fast paths through.

[[index]]
label = "Item"
prop = "qname"
notes = "Join key for list-callers and find-canonical verbs; high-cardinality, always indexed (RFC-035 §3.2)."

[[index]]
label = "Item"
prop = "bounded_context"
notes = "Scope-verb filter predicate (#169 / RFC-035 §3.6 fast path 2); low-cardinality, small index."

[[index]]
label = "Item"
computed = "last_segment(qname)"
notes = "Homonym-pair join key for context_homonym classifier rule (#48 class 2 / RFC-035 §3.6 cross-MATCH)."

[[index]]
label = "Item"
prop = "name"
notes = "Hash-join bucket for the slice-6b prop-to-prop equi-join — DuplicatedFeature joins on `a.name = b.name`. Without this entry the rule is O(n²) over `:Item` at scope time."

[[index]]
label = "Item"
prop = "reachable_from_entry"
notes = "Slice-5 narrow for RandomScattering / Unwired / CanonicalBypass — `reachable_from_entry = true|false` is a literal Eq, low-cardinality bucket. The intersect orders smallest-first so a huge `false` bucket does not seed `acc`."

[[index]]
label = "Item"
prop = "is_test"
notes = "Slice-5 narrow — every classifier filters `is_test = false`. Low-cardinality bucket; intersect-by-size avoids materialising the huge `false` set when a smaller hint exists."

[[index]]
label = "Item"
prop = "dup_cluster_id"
notes = "Hash-join bucket for `.cfdb/queries/hsb-cluster.cypher` — the v2 HSB detector joins on `a.dup_cluster_id = b.dup_cluster_id` (RFC-036 §3.4 signal S1). Without this entry the rule falls back to label scan + per-pair Cartesian on `:Item` (~80k items on cfdb-self post-extract), regressed cfdb-self smoke from ~1s to ~8min. Populated by `enrich_metrics` (RFC-036 §3.3, slice #203) as `sha256(lex_sorted(member_qnames))` keyed by shared `signature_hash`; sparse — only items in a fingerprint-duplicate cluster carry the prop. Sparse-prop buckets are cheap to index."

[[index]]
label = "Item"
computed = "conversion_prefix(name)"
notes = "Fork-join bucket for the RandomScattering classifier (examples/queries/classifier-random-scattering.cypher / RFC-035 §3.6 cross-MATCH). Buckets `:Item.name` by the leading `<stem>_<from|to|for|as>_` conversion prefix via the vetted regex; names without a conversion prefix contribute no posting (SQL NULL-index semantics). Without this entry the rule's `regexp_extract(a.name, …) = regexp_extract(b.name, …)` equi-join is an O(n²) Cartesian at scope time — measured 38ms @ n=1000 → 1.70s @ n=10000 locally, multi-minute at fleet-target scale. The recognition is byte-for-byte on the pattern literal (cfdb_petgraph::index::spec::CONVERSION_PREFIX_PATTERN)."
