[package]
name = "cfdb-extractor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cfdb-core = { path = "../cfdb-core" }
cfdb-concepts = { path = "../cfdb-concepts" }
# RFC-043 Slice A — `classify_arg_kind` shared between the syn and HIR
# extractors. The function pattern-matches on `syn::Expr`, so it cannot
# live in `cfdb-core` (RFC-032 §3 boundary: syn types cannot enter core).
cfdb-extractor-shared = { path = "../cfdb-extractor-shared" }
# RFC-041 §3.3 — `cfdb-extractor` becomes the concrete reference
# implementation of the `LanguageProducer` trait (`pub struct
# RustProducer`). The dep is unconditional from this crate; the
# *consumer* `cfdb-cli` makes its dep on `cfdb-extractor` optional so
# the slim build (`--no-default-features`) can drop the entire Rust
# producer stack.
cfdb-lang = { path = "../cfdb-lang" }
syn.workspace = true
# `span-locations` enables `proc_macro2::Span::start().line` so the
# extractor can report real source-line numbers instead of 0 (#273 /
# F-005). Without this, `Span::start()` is not even available and
# `:Item.line` / `:CallSite.line` are uniformly 0.
proc-macro2.workspace = true
cargo_metadata.workspace = true
serde.workspace = true
serde_json.workspace = true
# RFC-040 §3.3 — `:ConstTable.entries_hash` is sha256 over the canonical-
# sorted entry sequence. The dep is workspace-known
# (`Cargo.toml:58`) but was not transitive through `cfdb-cli`'s
# persistence layer (R2 absorbed rust-systems B2 correction); a direct
# dep line on the extractor is the minimum-impact wiring.
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
# RFC-043 Slice A — `quote::ToTokens::to_token_stream` converts a
# `syn::Expr` to its `proc_macro2::TokenStream` representation, giving
# `:Argument.source_text` for every emitted argument node. Runtime dep
# (not dev-dep) because `call_visitor.rs` uses it in the production
# emission path. `proc_macro2` is already a runtime dep above.
quote.workspace = true

[dev-dependencies]
tempfile.workspace = true
