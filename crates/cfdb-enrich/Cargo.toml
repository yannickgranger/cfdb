[package]
name = "cfdb-enrich"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The hub — GraphView/GraphBackend (the port), EnrichBackend (the trait this
# crate's EnrichEngine implements), EnrichReport, Node/Edge/PropValue.
cfdb-core = { path = "../cfdb-core" }
# bounded_context (056-B) + concepts (056-C) both resolve `.cfdb/concepts/*.toml`
# through the same `compute_bounded_context`/`load_concept_overrides` — single
# resolution point, no split-brain. Drops from cfdb-petgraph once 056-C lands
# (RFC-056 §2).
cfdb-concepts = { path = "../cfdb-concepts" }
# git_history (056-D). Same pin as cfdb-petgraph's own (now-unused) git2 dep
# — default-features = false drops ssh/https/ssh_key_from_memory, the pass
# only reads the local filesystem. Default builds (`cargo build -p cfdb-cli`)
# MUST have zero git2 in their dep tree (issue #105 / rust-systems Q1/Q6).
git2 = { version = "0.20", default-features = false, optional = true }

[features]
default = []
# Enables `EnrichEngine::enrich_git_history`'s real implementation; pulls
# git2. Without this feature the method returns a clear degraded report
# directing the caller to recompile with `--features git-enrich`.
git-enrich = ["dep:git2"]

[dev-dependencies]
# The moved enrichment-pass test suites need a concrete GraphBackend to run
# against, and PetgraphStore is the only one that exists (RFC-056 §2 —
# precedented by cfdb-petgraph's own [dev-dependencies] cfdb-query; exempt
# from the CLEAN-3 dependency-rule gate since tests/architecture_dep_rule.rs
# only scans [dependencies], never [dev-dependencies]). No production edge
# cfdb-enrich -> cfdb-petgraph exists or is intended.
cfdb-petgraph = { path = "../cfdb-petgraph" }
tempfile.workspace = true
