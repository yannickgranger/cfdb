[workspace]
resolver = "2"
members = [
    "mcp_fx",
    "cli_fx",
    "http_fx",
    "cron_fx",
    "ws_fx",
    "test_bench_fx",
    "clap",
    "axum",
]

# Fixture workspace for `tests/v02_1_coverage.rs` (Issue #126, RFC-029
# §A1.5 v0.2-1 coverage gate). Each member crate exercises one
# `:EntryPoint` kind with ≥2 shapes so a regression in a single shape
# fails its own recall assertion rather than hiding in a cross-kind
# aggregate.
#
# FRAMEWORK DEPS ARE STUBS. Detection stays syntactic (method-name +
# attribute-text + literal-arg): every member declares its idiom with a
# local stand-in `pub struct` / `pub trait`, never the real framework
# crate. The RFC-049 §3.1 manifest gate is crate-name-only, so a member
# whose detector is manifest-gated (cli_fx → `clap`, http_fx → `axum`)
# carries an EMPTY stub crate of the framework's name as a path
# dependency, purely so the crate graph exposes that name. mcp/cron/
# websocket detectors are not manifest-gated. This matches the stub-dep
# pattern in `tests/entry_point.rs` and `tests/http_route.rs`.
#
# This nested workspace is NOT a member of the parent cfdb workspace —
# the root `Cargo.toml` uses an explicit member list, and cargo treats
# this `[workspace]` root as independent.

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false
