[package]
name = "cfdb-hir-extractor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# HIR-backed extractor — Phase B of RFC-029. Scaffold only in this crate
# as shipped by Issue #84; resolved :CallSite / CALLS / INVOKES_AT
# emission lands in Issue #85, :EntryPoint in Issue #86. See
# `src/lib.rs` for the object-safety constraint on `HirDatabase` that
# governs every public signature in this crate.
#
# NEVER add `cfdb-hir-extractor` as a direct dep of `cfdb-cli` or
# `cfdb-petgraph`. The adapter crate (`cfdb-hir-petgraph-adapter`,
# #85) is the single integration seam, and `cfdb-cli` picks it up only
# through the `hir` feature flag (#86). This isolates the 90-150s cold
# compile cost from the default `cargo build -p cfdb-cli`.

[dependencies]
cfdb-core = { path = "../cfdb-core" }
# Canonical workspace-root resolver + loud workspace-relative `file`
# props (#561 — the #527/#540 discipline applied to the HIR producer).
cfdb-lang = { path = "../cfdb-lang" }
thiserror.workspace = true

# ra-analyzer HIR slice (=0.0.328 bundle — per workspace deps comment).
ra_ap_hir.workspace = true
ra_ap_hir_def.workspace = true
ra_ap_hir_ty.workspace = true
ra_ap_hir_expand.workspace = true
# base-db is brought in for its `pub use salsa` re-export used to
# attach the database to the current thread before HIR queries.
ra_ap_base_db.workspace = true
ra_ap_ide_db.workspace = true
ra_ap_syntax.workspace = true
ra_ap_vfs.workspace = true
ra_ap_project_model.workspace = true
ra_ap_proc_macro_api.workspace = true
ra_ap_load-cargo.workspace = true
ra_ap_edition.workspace = true

# rustc internals (independent cadence — rust-systems C1).
ra-ap-rustc_type_ir.workspace = true

[dev-dependencies]
tempfile.workspace = true
# DEV-ONLY. The cross-extractor qname-parity fixture test
# (`tests/qname_parity.rs`, RFC-044 §3.4) runs BOTH the syn-based
# extractor and this HIR extractor on the same fixture and asserts the
# `:Item` qnames they emit are bit-identical. This is a `[dev-dependencies]`
# edge, so it does NOT enter the production dep graph — the
# `NEVER add cfdb-hir-extractor as a direct dep` isolation note above (and
# the slim `cargo build -p cfdb-cli` cold-compile budget) is unaffected.
cfdb-extractor = { path = "../cfdb-extractor" }
# RFC-044 §3.2 / #428 — `tests/signatures.rs` re-parses this crate's seam
# source files with `syn`, renders the pinned signatures via `quote::quote!`,
# and compares against the frozen `tests/signatures.toml`. All three are
# test-only (the runtime extractor uses `ra_ap_syntax`, not `syn`). Dev-dep
# edges ⇒ no production dep-graph or cold-compile-budget impact, and they do
# not trip the `architecture_dep_rule` scan (`[dependencies]` only).
syn.workspace = true
quote.workspace = true
toml.workspace = true
