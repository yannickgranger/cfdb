# RFC-044 §3.2 / #428 — frozen composition-root factory signatures for cfdb-cli.
# Each value is the deterministic `quote::quote!(#sig).to_string()` rendering of
# the named `pub(crate) fn`'s `syn::Signature` in src/compose.rs. Captured by
# running tests/signatures.rs — do NOT hand-edit. The pinned-key count MUST equal
# the pub(crate) fn count in compose.rs (the test enforces this), so adding a
# factory without pinning it fails. Intentional change ⇒ update in the same commit.
empty_store = "fn empty_store () -> PetgraphStore"
ensure_keyspace_exists = "fn ensure_keyspace_exists (db : & Path , keyspace : & str) -> Result < PathBuf , CfdbCliError >"
load_store = "fn load_store (db : & Path , keyspace : & str ,) -> Result < (PetgraphStore , Keyspace) , CfdbCliError >"
load_store_with_workspace = "fn load_store_with_workspace (db : & Path , keyspace : & str , workspace_root : Option < PathBuf > ,) -> Result < (PetgraphStore , Keyspace) , CfdbCliError >"
save_store = "fn save_store (store : & PetgraphStore , keyspace : & Keyspace , db : & Path ,) -> Result < PathBuf , CfdbCliError >"
list_keyspace_names = "fn list_keyspace_names (db : & Path) -> Result < Vec < String > , CfdbCliError >"
